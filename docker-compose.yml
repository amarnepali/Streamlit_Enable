services:

  streamlit-app:
    build: .
    container_name: streamlit-enable
    restart: always
    expose:
      - "8501"

  nginx:
    image: nginx:latest
    container_name: streamlit-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - streamlit-app